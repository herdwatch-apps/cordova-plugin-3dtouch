# Two suites, because they answer different questions and neither can answer the other's.
#
#   paramedic     builds a throwaway app around the plugin, runs the Jasmine specs in tests/ inside
#                 it and reports the results. Its real value is the build: CDVSceneDelegate exists
#                 only from cordova-ios 8, so a scene symbol referenced unconditionally breaks 7.x
#                 at compile time -- silently, for anyone still on it. Hence a matrix over the
#                 cordova-ios version, not only over iOS.
#
#   quick action  long-presses the app icon on the Home Screen and checks the action arrives. That
#                 cannot be done from inside the app, so it needs Appium driving SpringBoard, and
#                 paramedic cannot cover it at all.
name: iOS Testsuite

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'demo/**'
      - 'screenshots/**'
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'demo/**'
      - 'screenshots/**'

permissions:
  contents: read

# macOS runners are the expensive part; don't leave superseded runs going.
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paramedic:
    name: paramedic, cordova-ios ${{ matrix.cordovaIos }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          # cordova-ios 7 is kept on Xcode 16: it predates 26 and is here to prove the plugin still
          # compiles for consumers who have not moved, not to be exercised on the newest toolchain.
          - os: macos-15
            xcode: 16.x
            cordovaIos: 7.1.1
          - os: macos-15
            xcode: 16.x
            cordovaIos: 8.1.1
          - os: macos-26
            xcode: 26.x
            cordovaIos: 8.1.1

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      # ios-deploy has to be global: "cordova requirements ios" needs it on PATH.
      - run: npm i -g ios-deploy@1.12.2

      - run: npm ci

      - run: npx cordova-paramedic --platform ios@${{ matrix.cordovaIos }} --plugin . --ci --verbose --cleanUpAfterRun

  quick-action:
    name: quick action delivery, iOS ${{ matrix.ios }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: 16.x
            ios: 18
          - os: macos-26
            xcode: 26.x
            ios: 26

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - run: npm i -g appium
      - run: appium driver install xcuitest

      - name: Start Appium
        run: |
          appium server --port 4723 --log-timestamp > appium.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4723/status > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Appium did not come up"
          cat appium.log
          exit 1

      - name: Boot an iOS ${{ matrix.ios }} simulator
        run: |
          # Pick the device explicitly. Left to itself the tooling happily falls back to "the first
          # available simulator", which would make the iOS column of this matrix a fiction.
          #
          # Read from --json rather than the text listing, and with python3 rather than awk: macOS
          # ships BSD awk, whose match() takes no capture-array argument, so the gawk form fails on
          # the runner while working on a developer's machine.
          # One line on purpose: inside a YAML block every line carries the block's indentation,
          # and a multi-line python -c would arrive indented and die on IndentationError.
          udid=$(xcrun simctl list devices available --json | python3 -c "import json,sys; ds=json.load(sys.stdin)['devices']; print(next(d['udid'] for r,v in ds.items() if '.iOS-${{ matrix.ios }}-' in r or r.endswith('.iOS-${{ matrix.ios }}') for d in v if d['name'].startswith('iPhone')))" 2>/dev/null || true)
          if [ -z "$udid" ]; then
            echo "no available iPhone simulator on iOS ${{ matrix.ios }}"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "IOS_UDID=$udid" >> "$GITHUB_ENV"

      - name: Quick action, cold start and already running
        env:
          LANG: en_US.UTF-8
        run: MODES="cold warm" npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: quick-action-ios${{ matrix.ios }}
          path: |
            appium.log
            /tmp/*.png
          if-no-files-found: ignore
