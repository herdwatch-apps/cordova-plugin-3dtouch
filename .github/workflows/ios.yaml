# Two suites, because they answer different questions and neither can answer the other's.
#
#   paramedic     builds a throwaway app around the plugin, runs the Jasmine specs in tests/ inside
#                 it and reports the results. Its real value is the build: CDVSceneDelegate exists
#                 only from cordova-ios 8, so a scene symbol referenced unconditionally breaks 7.x
#                 at compile time -- silently, for anyone still on it. Hence a matrix over the
#                 cordova-ios version, not only over iOS.
#
#   quick action  long-presses the app icon on the Home Screen and checks the action arrives. That
#                 cannot be done from inside the app, so it needs Appium driving SpringBoard, and
#                 paramedic cannot cover it at all.
#
# Between them that is seven native builds a run -- three paramedic apps, two fixture apps and two
# copies of WebDriverAgent -- on runners that bill at ten times the Linux rate, so the three that
# repeat unchanged are cached: the npm downloads, the quick-action fixture app and WebDriverAgent.
# Both build caches are keyed on the Xcode the image actually resolved to, not on the matrix label,
# which only pins a range. Paramedic's own build is deliberately NOT cached: proving the plugin
# still compiles against both cordova-ios versions is the entire point of that job.
name: iOS Testsuite

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'demo/**'
      - 'screenshots/**'
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'demo/**'
      - 'screenshots/**'

permissions:
  contents: read

# macOS runners are the expensive part; don't leave superseded runs going.
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paramedic:
    name: paramedic, cordova-ios ${{ matrix.cordovaIos }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          # cordova-ios 7 is kept on Xcode 16: it predates 26 and is here to prove the plugin still
          # compiles for consumers who have not moved, not to be exercised on the newest toolchain.
          - os: macos-15
            xcode: 16.x
            cordovaIos: 7.1.1
          - os: macos-15
            xcode: 16.x
            cordovaIos: 8.1.1
          - os: macos-26
            xcode: 26.x
            cordovaIos: 8.1.1

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Deliberately not setup-node's own `cache: npm`: its key is the lockfile hash plus darwin and
      # arm64, which every job here shares, so the five of them would race for one entry and the
      # winner's ~/.npm is missing whatever the others needed. A key per matrix row keeps each job's
      # downloads -- paramedic pulls ios-deploy, cordova-ios and the paramedic plugins.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-paramedic-${{ matrix.os }}-${{ matrix.cordovaIos }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-paramedic-${{ matrix.os }}-${{ matrix.cordovaIos }}-

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      # ios-deploy has to be global: "cordova requirements ios" needs it on PATH.
      - run: npm i -g ios-deploy@1.12.2

      - run: npm ci

      # --target is a regex over the simulator list, and paramedic's default (^iPhone) matches
      # nothing because those lines are indented -- it then falls back to "the first available",
      # which is how a matrix row ends up testing something else entirely.
      - run: npx cordova-paramedic --platform ios@${{ matrix.cordovaIos }} --target 'iPhone-1[6-9]' --plugin . --ci --verbose --cleanUpAfterRun

  quick-action:
    name: quick action delivery, iOS ${{ matrix.ios }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: 16.x
            ios: 18
          - os: macos-26
            xcode: 26.x
            ios: 26

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # See the note on the paramedic job for why this is not setup-node's built-in cache.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-quick-action-${{ matrix.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-quick-action-${{ matrix.os }}-

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Record the toolchain the build caches are keyed on
        id: toolchain
        run: |
          # Both caches below hold Xcode build products, so a new compiler has to miss them. The
          # matrix asks for a range (16.x), so read what the image actually resolved to -- an image
          # update inside that range would otherwise hand a stale build to a newer Xcode.
          slug=$(xcodebuild -version | tr '\n' '-' | tr -cd '[:alnum:].-')
          slug=${slug%-}
          echo "xcode=$slug" >> "$GITHUB_OUTPUT"
          echo "keyed on $slug"

      # The fixture app: a fixed shell around this plugin, built with cordova, ~2.5 min of the job.
      # Every input to that build is hashed here -- the plugin's own sources and plugin.xml, the
      # fixture's www/ and config.xml, and run.sh, which carries the cordova and cordova-ios
      # versions it builds with -- so a hit means the .app would come out identical. No restore-keys
      # on purpose: a near-miss here is the wrong app, not a warm start.
      - name: Restore the fixture app
        id: fixture
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/fixture-app
          key: fixture-${{ matrix.os }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('plugin.xml', 'package.json', 'src/**', 'www/**', 'tests/e2e/config.xml', 'tests/e2e/www/**', 'tests/e2e/run.sh') }}

      - run: npm i -g appium
      - run: appium driver install xcuitest

      - name: Start Appium
        run: |
          appium server --port 4723 --log-timestamp > appium.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4723/status > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Appium did not come up"
          cat appium.log
          exit 1

      - name: Boot an iOS ${{ matrix.ios }} simulator
        run: |
          # Pick the device explicitly. Left to itself the tooling happily falls back to "the first
          # available simulator", which would make the iOS column of this matrix a fiction.
          #
          # Read from --json rather than the text listing, and with python3 rather than awk: macOS
          # ships BSD awk, whose match() takes no capture-array argument, so the gawk form fails on
          # the runner while working on a developer's machine.
          # One line on purpose: inside a YAML block every line carries the block's indentation,
          # and a multi-line python -c would arrive indented and die on IndentationError.
          udid=$(xcrun simctl list devices available --json | python3 -c "import json,sys; ds=json.load(sys.stdin)['devices']; print(next(d['udid'] for r,v in ds.items() if '.iOS-${{ matrix.ios }}-' in r or r.endswith('.iOS-${{ matrix.ios }}') for d in v if d['name'].startswith('iPhone')))" 2>/dev/null || true)
          if [ -z "$udid" ]; then
            echo "no available iPhone simulator on iOS ${{ matrix.ios }}"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          # bootstatus returning is not the same as ready for XCUITest: a run failed with "the
          # simulator has failed to finish booting after 120s" right after this succeeded. Bringing
          # up Simulator.app gets it the rest of the way.
          open -a Simulator --args -CurrentDeviceUDID "$udid"
          echo "IOS_UDID=$udid" >> "$GITHUB_ENV"

      - name: Record the WebDriverAgent build inputs
        id: wda
        run: |
          # WebDriverAgent is the other native build here, and the expensive one: 219s of a measured
          # 8m04s job. Its products depend on the WDA sources, on Xcode, and on the deployment
          # target, which xcodebuild takes from the runtime of the simulator that just booted -- so
          # all three go in the key. If the bundled copy cannot be found, fall back to a key nothing
          # can match, so the run rebuilds and re-caches instead of trusting a guess.
          pkg=$(find "$HOME/.appium" -maxdepth 6 -type f -path '*/appium-webdriveragent/package.json' | head -1 || true)
          if [ -n "$pkg" ]; then
            version=$(node -p "require('$pkg').version")
          else
            echo "could not find the bundled appium-webdriveragent; keying this run uniquely"
            version="unknown-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          runtime=$(xcrun simctl list devices available --json | python3 -c "import json,os,sys; ds=json.load(sys.stdin)['devices']; u=os.environ['IOS_UDID']; print(next(r for r,v in ds.items() if any(d['udid']==u for d in v)).rsplit('.',1)[-1])")
          echo "key=$version-$runtime" >> "$GITHUB_OUTPUT"
          echo "WDA_DERIVED_DATA=$RUNNER_TEMP/wda-derived-data" >> "$GITHUB_ENV"
          echo "WebDriverAgent $version for $runtime"

      - name: Restore the WebDriverAgent build
        id: wda-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/wda-derived-data
          key: wda-${{ matrix.os }}-${{ steps.toolchain.outputs.xcode }}-${{ steps.wda.outputs.key }}

      - name: Quick action, cold start and already running
        env:
          LANG: en_US.UTF-8
          APP_CACHE: ${{ runner.temp }}/fixture-app
          # On a hit the driver runs the restored WebDriverAgent instead of compiling it. On a miss
          # this is the string "false" and the build happens as before, landing in the directory
          # above so the save step below can bank it.
          WDA_PREBUILT: ${{ steps.wda-cache.outputs.cache-hit == 'true' }}
        run: MODES="cold warm" npm run test:e2e

      - name: Note which builds this run produced
        id: built
        # Not always(): this workflow cancels superseded runs, and a build
        # interrupted mid-write must not be banked as a good one.
        if: ${{ !cancelled() }}
        run: |
          # Deliberately not gated on the probe passing. A build is just as reusable when the test
          # that followed it failed, and this suite gets iterated on with a red probe far more often
          # than a green one -- gating on success would mean paying for both builds every attempt.
          if [ -n "$(find "$RUNNER_TEMP/fixture-app" -maxdepth 1 -name '*.app' 2>/dev/null | head -1 || true)" ]; then
            echo "fixture=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -d "$RUNNER_TEMP/wda-derived-data/Build/Products/Debug-iphonesimulator/WebDriverAgentRunner-Runner.app" ]; then
            echo "wda=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the fixture app
        if: ${{ !cancelled() && steps.built.outputs.fixture == 'true' && steps.fixture.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/fixture-app
          key: ${{ steps.fixture.outputs.cache-primary-key }}

      - name: Save the WebDriverAgent build
        if: ${{ !cancelled() && steps.built.outputs.wda == 'true' && steps.wda-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/wda-derived-data
          key: ${{ steps.wda-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: quick-action-ios${{ matrix.ios }}
          path: |
            appium.log
            /tmp/*.png
          if-no-files-found: ignore
